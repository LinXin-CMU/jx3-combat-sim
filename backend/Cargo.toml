[package]
name = "jx3-combat-sim"
version = "2.0.10"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "compression-br"] }
toml = "0.8"
rayon = "1"
rand = "0.8"
rand_distr = "0.4"
encoding_rs = "0.8"
ahash = "0.8"
smallvec = "1"
sha2 = "0.10"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
fastembed = { version = "6.0.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

[build-dependencies]
winres = "0.1"
