# 铁骨衣 · 山海源流（2025.10）心法元信息（基线复制自分山劲，差异待校对）

name  = "铁骨衣"
class = "苍云"

# ── 主属性 → 副属性转化系数 ──────────────────────────────
[constants]
shenfa_to_attack  = 0.0     # 铁骨衣身法不转外功攻击（仅给会心）
shenfa_to_crit    = 0.9     # 身法 → 外功会心等级
lidao_to_attack   = 0.163   # 力道 → 外功攻击
lidao_to_overcome = 0.3     # 力道 → 外功破防
yuanqi_to_attack  = 0.181   # 元气 → 内功攻击（苍云外功线无所谓）
vitality_to_attack = 0.04   # 体质 → 外功攻击（铁骨衣特化）
vitality_to_parry_value = 2.25  # 体质 → 拆招值
vitality_to_parry_level = 0.18  # 体质 → 招架等级
parry_base_rate = 0.03          # 心法自带基础招架率（+3%）
non_player_bonus = 0.0          # 非侠士增伤（1024制，铁骨衣为0）

# ── 心法固定增益（仅心法本身的额外加成；全角色基础由后端 PLAYER_BASE_* 注入）──
[base_stats]
parry          = 6522.0   # 招架等级
parry_value    = 15085.0  # 拆招值
physics_shield = 3913.0   # 外功防御

# ── 心法转化（郭氏值 /1024；每项单独 / 1024 再 floor；结果不进攻击百分比增益）──
[mount_conversions]
vitality_to_attack      = 41     # 体质 → 外功攻击（41/1024 ≈ 0.04）
vitality_to_parry       = 184    # 体质 → 招架等级（184/1024 ≈ 0.18）
vitality_to_parry_value = 2304   # 体质 → 拆招值（2304/1024 = 2.25）
vitality_to_hp          = 2.2    # 体质 → 气血（额外加成，**不是郭氏**，直接小数；系统已 +10，合 12.2）

# ── 技能栏 UI 布局 ───────────────────────────────────────
[[ui.skill_groups]]
label  = "擎盾"
skills = ["盾击", "盾刀", "盾压", "盾猛", "盾挡", "偃守孤旌", "断马摧城"]

[[ui.skill_groups]]
label  = "擎刀"
skills = ["斩刀", "绝刀", "劫刀", "闪刀"]

[[ui.skill_groups]]
label  = "特殊"
skills = ["驭焰", "移除气劲"]

[[ui.skill_groups]]
label   = "通用"
new_row = true                     # 此组之前换行
skills  = ["血怒", "盾飞", "业火麟光", "盾舞", "撼地", "无惧", "寒啸千军", "征北"]

# ── 连招替换映射（combo 技能名 → 被替换的按钮技能名）────
[[ui.combo_replace]]
combo    = "隐刀"
replaces = "闪刀"

[[ui.combo_replace]]
combo    = "血刀"
replaces = "闪刀"

[[ui.combo_replace]]
combo    = "盾回"
replaces = "盾飞"

# ── A 工作流（循环蒸馏）参数 ────────────────────────────
[workflow_a]
default_consistency           = ["血怒", "业火麟光"]
consistency_sensitive_skills  = ["血怒", "业火麟光"]
