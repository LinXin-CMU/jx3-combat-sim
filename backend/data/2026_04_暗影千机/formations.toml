# 阵法（暗影千机 2026.04）
#
# 每场战斗最多开一个阵（GameMechanics 单选）
# - self 变体：当前心法 == owner_school 时显示，前 1-3 重永久属性走 effects；
#              4-6 重触发型走拟真挂载（jue_dao.rs / equip_effects::on_post_cast / on_hit.rs）
# - other 变体：当前心法 != owner_school 时显示，effects 是 jx3dps 已覆盖率折算的"假永久"数值
# - any 变体：通用阵，无所属心法
#
# 数据来源：
#  - description: ui/Scheme/Case/skill.txt 各阵法"描述技能"原文（游戏内 1-6 重）
#  - 永久 / 折算数值: jx3dps-online-public src/数据/阵眼/
#  - 4-6 重触发型 BuffDef: 本地 buff.txt + Buff.tab
#
# AttribField 单位约定（与 buffs.rs 一致）：
#  - *Base：直接数值或等级加算（如 SurplusValueBase 2667 = +2667 破招值）
#  - *Percent：1024 制百分比加成（如 PhysicsAttackPowerPercent 51 = +5%）
#  - PhysicsCriticalStrikePercent：1024 制（jx3dps 0.03 = round(0.03 × 1024) = 31）
#  - ParryValuePercent：10000 制（招架率 +N/10000；jx3dps 0.03 = 300）
#  - VitalityBasePercentAdd：1024 制（jx3dps 0.09 = round(0.09 × 1024) = 92）
#  - WeaponDamageBase：直接数值（武器伤害）

