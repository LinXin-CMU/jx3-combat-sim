# 铁骨衣 · 苍生铸世测试服（2026.10）独立心法

name  = "铁骨衣"
class = "苍云"

# ── 主属性 → 副属性转化系数 ──────────────────────────────
[constants]
shenfa_to_attack = 0.0
shenfa_to_crit = 0.25
lidao_to_attack = 0.195
lidao_to_overcome = 0.061
yuanqi_to_attack = 0.195
vitality_to_attack = 0.14
vitality_to_parry_value = 1.6
vitality_to_parry_level = 0.16
parry_base_rate = 0.03          # 心法自带基础招架率（+3%）
non_player_bonus = 0.0          # 非侠士增伤（1024制，铁骨衣为0）

# ── 心法固定增益（仅心法本身的额外加成；全角色基础由后端 PLAYER_BASE_* 注入）──
[base_stats]
parry = 457.0
parry_value = 1056.0
physics_shield = 274.0

# ── 心法转化（郭氏值 /1024；每项单独 / 1024 再 floor；结果不进攻击百分比增益）──
[mount_conversions]
vitality_to_attack = 143.36
vitality_to_parry = 163.84
vitality_to_parry_value = 1638.4
vitality_to_hp          = 2.2    # 体质 → 气血（额外加成，**不是郭氏**）

# ── UI 配置 ───────────────────────────────────────────────
base_life_percent = 0.05
[ui]
talent_tiers = 6    # 暗影千机：6层固定 + 混选池

[[ui.skill_groups]]
label  = "擎盾"
skills = ["盾击", "盾刀", "盾压", "盾猛", "盾挡", "偃守孤旌", "断马摧城"]

[[ui.skill_groups]]
label  = "擎刀"
skills = ["斩刀", "绝刀", "劫刀", "闪刀", "盾回"]

[[ui.skill_groups]]
label  = "特殊"
skills = ["驭焰", "移除气劲", "预释放"]

[[ui.skill_groups]]
label   = "通用"
new_row = true                     # 此组之前换行
skills  = ["血怒", "盾飞", "业火麟光", "盾舞", "撼地", "无惧", "寒啸千军", "征北"]

# ── 连招替换映射（combo 技能名 → 被替换的按钮技能名）────
[[ui.combo_replace]]
combo    = "隐刀"
replaces = "闪刀"

[[ui.combo_replace]]
combo    = "血刀"
replaces = "闪刀"

[[ui.combo_replace]]
combo    = "盾回"
replaces = "盾飞"

# ── A 工作流（循环蒸馏）参数 ────────────────────────────
[workflow_a]
default_consistency           = ["血怒", "业火麟光"]
consistency_sensitive_skills  = ["血怒", "业火麟光"]
