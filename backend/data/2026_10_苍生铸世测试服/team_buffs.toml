# 团队增益数据（暗影千机 2026.04）
# 参考 jx3dps-online + 游戏 buff.txt 核对，共 50 条
# buff_id 走项目自定义 0xD0000001 起占位段，避免与铁骨衣自身 BUFF_HAN_XIAO/BUFF_ZHEN_FEN 等冲突
# 单层数值见 v2026/buffs/team_buffs.rs 内的 BuffDef.effects；toml 仅描述排程参数
#
# 字段说明：
#   default_period  = 0    → 永久挂（duration 0 = 永久）
#   default_period  > 0    → 周期性，每 period 秒挂一次，单次持续 duration 秒
#   stacks/max_stacks      → 层数（一次挂多少层；max 用于 UI）
#   is_target_buff = true  → 走 add_target_buff（戒火/虚弱/破风等）

