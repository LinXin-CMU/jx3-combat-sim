limit_req_zone $binary_remote_addr zone=jx3_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jx3_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=jx3_connections:10m;
server {
    listen 2014 ssl;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/jx3-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jx3-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn jx3_connections 24;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location = /api/auth/login {
        limit_req zone=jx3_login burst=5 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:2015;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        limit_req zone=jx3_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:2015;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
